[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
addopts = 
    -v 
    --html=reports/report.html
    --self-contained-html
    --tb=short
    --log-cli-level=INFO
    --log-cli-format="%(asctime)s %(levelname)-8s - %(message)s"
    --log-cli-date-format="%H:%M:%S"
    --log-level=CRITICAL
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)-8s - %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: 冒煙測試
    regression: 回歸測試
